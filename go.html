<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Google Play…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#FFF7ED;color:#1C1814;padding:24px;text-align:center;
  }
  .box{max-width:360px;width:100%}
  h1{font-size:22px;margin-bottom:10px}
  p{font-size:15px;color:#6F665C;margin-bottom:22px;line-height:1.5}
  .btn{
    display:none;padding:14px 22px;border-radius:12px;background:#E65100;color:#fff;
    font-weight:700;font-size:16px;text-decoration:none;margin-bottom:14px;
  }
  .lnk{display:none;font-size:14px;color:#6F665C;text-decoration:underline}
  .brand{margin-top:28px;font-size:12px;color:#9a8f82;letter-spacing:1px}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Opening Google Play…</h1>
  <p id="sub">Please wait a moment.</p>
  <a id="openApp" class="btn" href="#">Open in Play Store app</a><br>
  <a id="openWeb" class="lnk" href="#">Open in browser instead</a>
  <div class="brand">LIHKA GAMES</div>
</div>

<script>
(function(){
  var id = (new URLSearchParams(location.search).get('id') || '').trim();

  /* accept only a valid Android package name, nothing else */
  if(!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$/.test(id)){
    document.getElementById('title').textContent = 'Link not valid';
    document.getElementById('sub').textContent   = 'Please go back and try again.';
    return;
  }

  var web = 'https://play.google.com/store/apps/details?id=' + id;
  var isAndroid = /Android/i.test(navigator.userAgent);

  if(!isAndroid){
    /* iPhone / desktop: normal Google Play web page */
    location.replace(web);
    return;
  }

  /* Android: open the Play Store APP directly.
     If the Play Store app is missing, Chrome uses the fallback URL (web page). */
  var intentUrl = 'intent://details?id=' + id +
                  '#Intent;scheme=market;package=com.android.vending;' +
                  'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';

  var btn = document.getElementById('openApp');
  var lnk = document.getElementById('openWeb');
  btn.href = intentUrl;  btn.style.display = 'inline-block';
  lnk.href = web;        lnk.style.display = 'inline-block';

  /* automatic attempt */
  location.replace(intentUrl);

  /* if the browser blocked the automatic attempt, the button works with one tap */
  setTimeout(function(){
    document.getElementById('sub').textContent = 'If the app did not open, tap the button below.';
  }, 1200);
})();
</script>
<noscript><p><a href="https://play.google.com/">Open Google Play</a></p></noscript>
</body>
</html>
